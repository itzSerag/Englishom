# ============================================================
# Nginx Virtual Host — Englishom API Reverse Proxy
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Request size limit (matches NestJS 20MB + headroom)
    client_max_body_size 25M;

    # Rate limiting
    limit_req zone=api burst=60 nodelay;
    limit_conn conn 20;

    # Proxy all traffic to NestJS app
    location / {
        proxy_pass http://nestjs;
        proxy_http_version 1.1;

        # WebSocket / SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client metadata
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (generous for ML speech recognition inference)
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://nestjs/api;
        access_log off;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
    }
}
