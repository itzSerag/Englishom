# ============================================================
# Nginx Virtual Host — Englishom API
# Replace yourdomain.com with your actual domain before deploy
# ============================================================

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Required for Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yourdomain.com www.yourdomain.com;

    # ── TLS Certificates (managed by Certbot) ─────────────
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # ── Modern TLS hardening ───────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Security Headers ───────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            DENY                                           always;
    add_header X-Content-Type-Options     nosniff                                        always;
    add_header Referrer-Policy            "no-referrer-when-downgrade"                   always;
    add_header X-XSS-Protection           "1; mode=block"                                always;

    # ── Request limits ─────────────────────────────────────
    client_max_body_size 25M;   # Matches NestJS 20 MB limit + headroom

    # ── Rate limiting ──────────────────────────────────────
    limit_req  zone=api  burst=60  nodelay;
    limit_conn zone=conn 20;

    # ── Proxy to NestJS ────────────────────────────────────
    location /api/ {
        proxy_pass         http://nestjs;
        proxy_http_version 1.1;

        # WebSocket / SSE support
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # Forward real client metadata
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts (generous for ML inference endpoints)
        proxy_connect_timeout  10s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # Don't buffer large responses (audio/video streams)
        proxy_buffering    off;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Health check endpoint (no rate limit) ─────────────
    location = /health {
        proxy_pass http://nestjs/api;
        access_log off;
    }

    # ── Block common attack vectors ───────────────────────
    location ~ /\. {
        deny all;
    }
}
