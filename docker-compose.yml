services:
  # Englishom NestJS API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: englishom-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.production
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      TRANSFORMERS_CACHE: /app/.cache
    depends_on:
      mongodb:
        condition: service_healthy
        required: false
    volumes:
      # Cache downloaded AI models across container restarts
      - model_cache:/app/.cache
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # MongoDB Database (used if DATABASE_URL points to mongodb://mongodb:27017)
  mongodb:
    image: mongo:7-jammy
    container_name: englishom-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-Englishom}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # Optional Nginx Reverse Proxy (start with: docker compose --profile proxy up -d)
  nginx:
    image: nginx:1.27-alpine
    container_name: englishom-nginx
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - backend

volumes:
  mongo_data:
  model_cache:

networks:
  backend:
    driver: bridge
